<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" fill="none"
     stroke="#211d16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Generic tablet body (portrait), not a specific product -->
  <rect x="120" y="70" width="300" height="470" rx="26" />
  <!-- Screen inset -->
  <rect x="144" y="100" width="252" height="392" rx="10" stroke-width="4" />
  <!-- Camera dot / sensor -->
  <circle cx="270" cy="520" r="6" stroke-width="4" />
  <!-- A few ruled lines to read as a writing surface -->
  <line x1="170" y1="170" x2="370" y2="170" stroke-width="3" />
  <line x1="170" y1="210" x2="370" y2="210" stroke-width="3" />
  <line x1="170" y1="250" x2="330" y2="250" stroke-width="3" />
  <!-- Stylus, standing upright to the right of the tablet -->
  <rect x="480" y="100" width="28" height="360" rx="14" />
  <!-- Grip band -->
  <line x1="480" y1="440" x2="508" y2="440" stroke-width="4" />
  <!-- Nib -->
  <path d="M480 460 L508 460 L494 496 Z" />
</svg>
