<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Daily Scribe favicon: masthead initial S, house red (accent token
       oklch 48% 0.16 25) with cream (bg token). Letter uses system serifs so
       the file needs no embedded font; Georgia / Times render near-identically
       at this size. -->
  <rect width="32" height="32" rx="6.5" fill="#B0402E"/>
  <text x="16" y="16.6" fill="#F7F3EA"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-weight="700" font-size="27"
        text-anchor="middle" dominant-baseline="central">S</text>
</svg>
