<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — The Daily Scribe</title>
    <!-- Absolute path: avoids Decap's default relative "config.yml" lookup,
         which breaks here since the browser URL is "/admin" (no trailing
         slash), not "/admin/" — see next.config.mjs's rewrite comment. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Loaded from the CDN rather than an npm dependency — Decap's own
         recommended zero-build quick start; config.yml is auto-discovered
         from this same directory. Pinned to an exact version with a
         Subresource Integrity hash so the browser refuses any tampered or
         swapped payload. If a Decap upgrade is wanted, bump the version AND
         regenerate the hash:
           curl -sL https://unpkg.com/decap-cms@<ver>/dist/decap-cms.js \
             | openssl dgst -sha384 -binary | openssl base64 -A -->
    <script
      src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"
      integrity="sha384-WFBlw1ZGvgE9W2ia0r2gJPu3HOVweIpoHCGmlm3f/9J2OURAjzuJ/lV55gUd4By4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
