# Drives Daily Scribe's daily delivery dispatch.
#
# Why this exists: Vercel Hobby cron only fires once a day. `dispatchDue` sends a
# subscription when the subscriber's *local* clock is at or past their chosen
# delivery time, so a single daily run can never honour a per-subscriber time
# across timezones -- anyone whose local delivery time falls after that one run
# would never be sent to. This workflow polls the dispatch endpoint every ~10
# minutes instead; the send is still exactly-once per day (guarded by the
# per-day `deliveries` marker row), it just goes out on the first tick at or
# after each subscriber's local delivery time. `apps/web/vercel.json` keeps a
# once-daily cron as a fallback for when GitHub Actions is unavailable.
#
# To move onto native Vercel Cron instead: upgrade to Vercel Pro, set the
# dispatch cron in apps/web/vercel.json to "0 * * * *", and delete this file.
#
# Requires repo secret CRON_SECRET (same value as the Vercel env var of the same
# name). Notes: scheduled workflows only run from the default branch, and GitHub
# disables them after 60 days with no repository activity.

name: dispatch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/dispatch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET repo secret is not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://my.dailyscribe.ca/api/cron/dispatch
