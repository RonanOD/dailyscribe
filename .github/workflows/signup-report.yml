# Emails ADMIN_EMAIL a once-a-day digest of new waitlist signups so the operator
# knows when to run apps/web/scripts/approve-waitlist.mjs. The endpoint sends
# nothing on a quiet day and its 24h window is idempotent for a fixed-time run,
# so this is kept separate from dispatch.yml (different schedule, non-critical --
# a missed day self-heals via the running "pending total").
#
# Requires repo secret CRON_SECRET (same value as the Vercel env var). Also
# needs ADMIN_EMAIL set in the apps/web Vercel project. Scheduled workflows only
# run from the default branch.

name: signup-report

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: signup-report
  cancel-in-progress: false

jobs:
  signup-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/signup-report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET repo secret is not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://my.dailyscribe.ca/api/cron/signup-report
